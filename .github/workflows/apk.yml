name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Bundle the game into the app
        run: |
          mkdir -p android/app/src/main/assets/www
          cp -r index.html icon.svg manifest.webmanifest vendor android/app/src/main/assets/www/
      - name: Build
        run: gradle -p android assembleDebug --no-daemon
      - name: Publish APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk jaraghe.apk
          gh release view apk >/dev/null 2>&1 || gh release create apk --title "جرقه — APK" --notes "آخرین نسخه‌ی اندروید بازی (آفلاین)."
          gh release upload apk jaraghe.apk --clobber
